[FilterPlugin]
; BuildPlugin's default filter includes native build products and Source, but the
; runtime and editor also need the managed assemblies, projects and build scripts.
/Binaries/Managed/...
/Build/Scripts/...
/Config/...
/Managed/...
/Templates/...
/Directory.Packages.props
/UnrealSharp*.props
/UnrealSharp.sln
/README.md
/LICENSE

; The plugin's managed project and PackageProject command compile this generated
; source. Include bindings and target defines, not exporter timestamps or caches.
/Intermediate/UnrealSharp/UHT/.../*.cs
/Intermediate/UnrealSharp/UHT/.../UE5Rules.Defines.props

; Keep local managed build caches out of the distributed plugin.
-/Build/Scripts/bin/...
-/Build/Scripts/obj/...
-/Build/Scripts/uatbin/...
-/Build/Scripts/uatobj/...
-/Managed/.../bin/...
-/Managed/.../obj/...
-/Source/UnrealSharpManagedGlue/bin/...
-/Source/UnrealSharpManagedGlue/obj/...

; SDK-style managed projects use Roslyn's NetCore build host. The legacy
; .NET Framework host contains an executable that cannot be included on Fab.
-/Binaries/Managed/.../BuildHost-net472/...
-/Binaries/Managed/.../UnrealSharp.GlueGenerator.Tests.*
